<!DOCTYPE html>
<html lang="en" th:replace="~{base :: parent(~{::#content}, 'Login',~{})}">

<head>

</head>

<body>
    <div id="content">

        <div class="min-h-screen flex items-center justify-center px-4">

            <div class="w-full max-w-md">

                <!-- Card -->
                <div class="block p-6 border-t-10 border-blue-700 bg-white rounded-xl shadow
                    hover:bg-gray-100 dark:bg-gray-800 dark:border-blue-700 dark:hover:bg-gray-700">

                    <!-- Message Box -->
                    <div th:replace="~{message :: messagebox}"></div>

                    <!-- Login Error -->
                    <div th:if="${param.error}"
                        class="p-4 mb-4 text-sm text-red-800 rounded-lg bg-red-50 dark:bg-gray-700 dark:text-red-400">
                        Invalid Email or Password
                    </div>

                    <!-- Logout Success -->
                    <div th:if="${param.logout}"
                        class="p-4 mb-4 text-sm text-green-800 rounded-lg bg-green-50 dark:bg-gray-700 dark:text-green-400">
                        You have been logged out successfully.
                    </div>

                    <h5 class="mb-2 text-2xl font-bold tracking-tight text-gray-900 dark:text-white">
                        Login Here
                    </h5>

                    <p class="font-normal text-gray-400 dark:text-gray-400">
                        Access and manage your contacts on cloud ...
                    </p>

                    <!-- Login Form -->
                    <form th:action="@{/authenticate}" method="post" class="mt-5">

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                                Email
                            </label>

                            <input type="email" name="email" id="email" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg w-full p-2.5
                                focus:ring-blue-500 focus:border-blue-500
                                dark:bg-gray-700 dark:border-gray-600 dark:text-white" placeholder="Enter your email"
                                required>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                                Password
                            </label>

                            <input type="password" name="password" id="password" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg w-full p-2.5
                                focus:ring-blue-500 focus:border-blue-500
                                dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                                placeholder="Enter your password" required>
                        </div>


                        <!-- Buttons -->
                        <div class="flex justify-center space-x-3 mt-4">
                            <button type="submit" class="px-4 py-2 rounded bg-blue-600 hover:bg-blue-700 text-white">
                                Login
                            </button>
                        </div>

                        <!-- Signup Link -->
                        <p class="text-center mt-5 text-sm text-gray-600 dark:text-gray-400">
                            Don't have an account?
                            <a th:href="@{/signup}"
                                class="text-blue-600 hover:underline dark:text-blue-500 font-medium">
                                Signup
                            </a>
                        </p>

                    </form>

                    <!-- Social Login Buttons -->
                    <div class="mt-4 space-y-3">

                        <!-- Google Login -->
                        <a href="/oauth2/authorization/google"
                            class="flex items-center justify-center w-full px-4 py-2 border border-gray-300 rounded-lg bg-white text-gray-700 hover:bg-gray-100">

                            <svg class="w-5 h-5 mr-2" viewBox="0 0 48 48">
                                <path fill="#FFC107"
                                    d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.7 1.1 7.8 3l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z" />
                                <path fill="#FF3D00"
                                    d="M6.3 14.7l6.6 4.8C14.7 15.3 19 12 24 12c3 0 5.7 1.1 7.8 3l5.7-5.7C34.1 6.1 29.3 4 24 4c-7.7 0-14.3 4.4-17.7 10.7z" />
                                <path fill="#4CAF50"
                                    d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3c-2.1 1.5-4.7 2.5-7.3 2.5-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.6 39.5 16.2 44 24 44z" />
                                <path fill="#1976D2"
                                    d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.1-3.3 5.7-6.3 7.5l6.3 5.3C39.2 37.2 44 31.1 44 24c0-1.2-.1-2.4-.4-3.5z" />
                            </svg>

                            Continue with Google
                        </a>

                        <!-- GitHub Login -->
                        <a href="/oauth2/authorization/github"
                            class="flex items-center justify-center w-full px-4 py-2 rounded-lg bg-gray-900 text-white hover:bg-black">

                            <svg class="w-5 h-5 mr-2 fill-current" viewBox="0 0 24 24">
                                <path
                                    d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56v-2.17c-3.2.69-3.88-1.37-3.88-1.37-.52-1.31-1.27-1.66-1.27-1.66-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.24 3.34.95.1-.74.4-1.24.72-1.53-2.55-.29-5.23-1.28-5.23-5.69 0-1.26.45-2.29 1.18-3.09-.12-.29-.51-1.47.11-3.06 0 0 .96-.31 3.15 1.18.91-.25 1.89-.38 2.86-.39.97.01 1.95.14 2.86.39 2.18-1.49 3.14-1.18 3.14-1.18.63 1.59.24 2.77.12 3.06.74.8 1.18 1.83 1.18 3.09 0 4.42-2.69 5.4-5.25 5.69.41.35.78 1.03.78 2.08v3.08c0 .31.21.67.8.56A11.51 11.51 0 0023.5 12C23.5 5.65 18.35.5 12 .5z" />
                            </svg>

                            Continue with GitHub
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>
</body>

</html>
