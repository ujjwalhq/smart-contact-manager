<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Email Verified | PeopleDesk</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body class="bg-[#0F172A] flex items-center justify-center min-h-screen px-5">

<div class="bg-[#111827] border border-gray-700 rounded-2xl shadow-2xl
            max-w-lg w-full p-10 text-center">

    <div class="w-24 h-24 rounded-full bg-green-500/20
                flex items-center justify-center mx-auto">

        <i class="fa-solid fa-circle-check text-green-500 text-6xl"></i>

    </div>

    <h1 class="text-4xl font-bold text-white mt-8">
        Email Verified
    </h1>

    <p class="text-gray-400 mt-4 leading-7">

        Congratulations!

        <br><br>

        Your PeopleDesk account has been successfully verified.

        You can now sign in and start managing your contacts.

    </p>

    <a href="/login"
       class="inline-block mt-8 px-8 py-3 rounded-lg
              bg-[#1447E6]
              hover:bg-blue-700
              text-white
              font-semibold
              transition">

        <i class="fa-solid fa-right-to-bracket mr-2"></i>

        Go To Login

    </a>

</div>

</body>
</html>
