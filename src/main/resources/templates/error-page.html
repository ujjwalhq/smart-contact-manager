<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verification Failed | PeopleDesk</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body class="bg-[#0F172A] flex items-center justify-center min-h-screen px-5">

<div class="bg-[#111827] border border-gray-700 rounded-2xl shadow-2xl
            max-w-lg w-full p-10 text-center">

    <div class="w-24 h-24 rounded-full bg-red-500/20
                flex items-center justify-center mx-auto">

        <i class="fa-solid fa-circle-xmark text-red-500 text-6xl"></i>

    </div>

    <h1 class="text-4xl font-bold text-white mt-8">
        Verification Failed
    </h1>

    <p class="text-gray-400 mt-4 leading-7">

        Sorry!

        <br><br>

        This verification link is invalid, expired,
        or has already been used.

        <br><br>

        Please register again or request a new verification email.

    </p>

    <div class="mt-8 flex justify-center gap-4">

        <a href="/login"
           class="px-6 py-3 rounded-lg
                  bg-[#1447E6]
                  hover:bg-blue-700
                  text-white
                  font-medium">

            Login

        </a>

        <a href="/signup"
           class="px-6 py-3 rounded-lg
                  bg-gray-700
                  hover:bg-gray-600
                  text-white
                  font-medium">

            Register Again

        </a>

    </div>

</div>

</body>
</html>
