<aside
    id="logo-sidebar"
    th:fragment="sidebar"
    class="fixed top-0 left-0 z-40 w-64 h-screen transition-transform -translate-x-full sm:translate-x-0 bg-white border-r border-gray-200 dark:bg-gray-800 dark:border-gray-700"
    aria-label="Sidebar">

    <!-- Logo -->
    <div class="flex items-center gap-3 p-5 border-b dark:border-gray-700">

        <img
            src="https://i.postimg.cc/4ym1bThL/Contact-logo-removebg-preview.png"
            class="w-8 h-8"
            alt="logo">

        <span class="text-xl font-bold text-gray-900 dark:text-white">
            PeopleDesk
        </span>

    </div>

    <!-- Navigation -->
    <div class="px-3 py-4 overflow-y-auto">

        <ul class="space-y-2 font-medium">

            <li>
                <a th:href="@{/user/dashboard}"
                    class="flex items-center p-3 rounded-lg text-gray-900 dark:text-white hover:bg-blue-100 dark:hover:bg-gray-700">

                    <i class="fa-solid fa-house w-5"></i>

                    <span class="ms-3">Dashboard</span>

                </a>
            </li>

            <li>
                <a th:href="@{/user/profile}"
                    class="flex items-center p-3 rounded-lg text-gray-900 dark:text-white hover:bg-blue-100 dark:hover:bg-gray-700">

                    <i class="fa-solid fa-user w-5"></i>

                    <span class="ms-3">Profile</span>

                </a>
            </li>

            <li>
                <a th:href="@{/user/contacts/add}"
                    class="flex items-center p-3 rounded-lg text-gray-900 dark:text-white hover:bg-blue-100 dark:hover:bg-gray-700">

                    <i class="fa-solid fa-user-plus w-5"></i>

                    <span class="ms-3">Add Contact</span>

                </a>
            </li>

            <li>
                <a th:href="@{/user/contacts}"
                    class="flex items-center p-3 rounded-lg text-gray-900 dark:text-white hover:bg-blue-100 dark:hover:bg-gray-700">

                    <i class="fa-solid fa-address-book w-5"></i>

                    <span class="ms-3">View Contacts</span>

                </a>
            </li>

            <li>
                <a th:href="@{/user/settings}"
                    class="flex items-center p-3 rounded-lg text-gray-900 dark:text-white hover:bg-blue-100 dark:hover:bg-gray-700">

                    <i class="fa-solid fa-gear w-5"></i>

                    <span class="ms-3">Settings</span>

                </a>
            </li>

            <li>
                <a th:href="@{/logout}"
                    class="flex items-center p-3 rounded-lg text-red-600 hover:bg-red-100 dark:hover:bg-red-900">

                    <i class="fa-solid fa-right-from-bracket w-5"></i>

                    <span class="ms-3">Logout</span>

                </a>
            </li>

        </ul>

    </div>

</aside>
