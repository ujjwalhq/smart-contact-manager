<!DOCTYPE html>
<html lang="en" th:replace="~{user/user_base :: parent(~{::#content},'Contacts')}">

<div id="content">

  <div class="max-w-7xl mx-auto">

    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">

      <div>
        <h1 class="text-3xl font-bold text-gray-900 dark:text-white">
          My Contacts
        </h1>

        <p class="text-gray-500 dark:text-gray-400">
          Manage and organize your personal and professional contacts.
        </p>
      </div>

      <a th:href="@{/user/contacts/add}"
        class="inline-flex items-center justify-center px-5 py-2.5 text-sm font-medium text-white bg-blue-700 rounded-lg hover:bg-blue-800">

        <i class="fa-solid fa-user-plus mr-2"></i>
        Add Contact

      </a>

    </div>

    <!-- Search -->
    <div class="mb-6">

      <div class="relative">

        <div class="absolute inset-y-0 start-0 flex items-center ps-3">

          <i class="fa-solid fa-magnifying-glass text-gray-400"></i>

        </div>

        <input type="text" placeholder="Search contacts..." class="block w-full p-3 ps-10 text-sm border border-gray-300 rounded-lg
                       bg-gray-50 focus:ring-blue-500 focus:border-blue-500
                       dark:bg-gray-800 dark:border-gray-700 dark:text-white">

      </div>

    </div>

    <!-- DESKTOP TABLE -->
    <div class="hidden md:block">

      <div class="overflow-x-auto rounded-xl border border-gray-200 dark:border-gray-700 shadow">

        <table class="w-full text-sm text-left">

          <thead class="bg-gray-100 dark:bg-gray-800">

            <tr>

              <th class="px-6 py-4">Contact</th>
              <th class="px-6 py-4">Email</th>
              <th class="px-6 py-4">Phone</th>
              <th class="px-6 py-4">Social Links</th>
              <th class="px-6 py-4 text-center">Actions</th>

            </tr>

          </thead>

          <tbody>

            <tr th:each="contact : ${contacts}"
              class="bg-white border-b dark:bg-gray-900 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800">

              <!-- Contact -->
              <td class="px-6 py-4">

                <div class="flex items-center gap-3">

                  <img th:src="${contact.picture}" class="w-12 h-12 rounded-full object-cover border">

                  <div>

                    <div class="font-semibold text-gray-900 dark:text-white" th:text="${contact.name}">
                    </div>

                    <div class="text-xs text-gray-500" th:text="${contact.address}">
                    </div>

                  </div>

                </div>

              </td>

              <td class="px-6 py-4" th:text="${contact.email}">
              </td>

              <td class="px-6 py-4" th:text="${contact.phoneNumber}">
              </td>

              <!-- Social Links -->
              <td class="px-6 py-4">
                <div class="flex gap-4">

                  <!-- Email -->
                  <a th:href="'mailto:' + ${contact.email}" class="text-red-500 hover:text-red-600" title="Send Email">

                    <i class="fa-solid fa-envelope text-lg"></i>

                  </a>

                  <!-- WhatsApp -->
                  <a th:href="'https://wa.me/91' + ${contact.phoneNumber}" target="_blank"
                    class="text-green-500 hover:text-green-600" title="Chat on WhatsApp">

                    <i class="fa-brands fa-whatsapp text-lg"></i>

                  </a>

                  <!-- LinkedIn -->
                  <a th:if="${contact.linkedInLink != null && !#strings.isEmpty(contact.linkedInLink)}"
                    th:href="${contact.linkedInLink}" target="_blank" class="text-blue-600 hover:text-blue-700"
                    title="LinkedIn Profile">

                    <i class="fa-brands fa-linkedin text-lg"></i>

                  </a>
                  
                  <!-- Website -->
                  <a th:if="${contact.websiteLink != null && !#strings.isEmpty(contact.websiteLink)}"
                    th:href="${contact.websiteLink}" target="_blank" class="text-gray-500 hover:text-blue-600"
                    title="Visit Website">

                    <i class="fa-solid fa-globe text-lg"></i>

                  </a>


                </div>

              </td>

              <!-- Actions -->
              <td class="px-6 py-4">

                <div class="flex justify-center gap-2">

                  <button class="px-3 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    <i class="fa-solid fa-eye"></i>
                  </button>

                  <button class="px-3 py-2 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600">
                    <i class="fa-solid fa-pen"></i>
                  </button>

                  <button class="px-3 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">
                    <i class="fa-solid fa-trash"></i>
                  </button>

                </div>

              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

    <!-- MOBILE VIEW -->
    <div class="grid gap-4 md:hidden">

      <div th:each="contact : ${contacts}"
        class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-4 shadow">

        <div class="flex items-center gap-3">

          <img th:src="${contact.picture}" class="w-14 h-14 rounded-full object-cover border" alt="contact">

          <div class="flex-1">

            <h3 class="font-semibold text-gray-900 dark:text-white" th:text="${contact.name}">
              John Doe
            </h3>

            <p class="text-sm text-gray-500" th:text="${contact.address}">
              Address
            </p>

          </div>

        </div>

        <div class="mt-4 space-y-2 text-sm">

          <p class="text-gray-700 dark:text-gray-300">
            <i class="fa-solid fa-envelope w-5"></i>
            <span th:text="${contact.email}"></span>
          </p>

          <p class="text-gray-700 dark:text-gray-300">
            <i class="fa-solid fa-phone w-5"></i>
            <span th:text="${contact.phoneNumber}"></span>
          </p>



        </div>

        <!-- Social Links -->
        <div class="mt-4 flex items-center justify-between">

          <!-- Social Links -->
          <div class="flex gap-4">

            <!-- Email -->
            <a th:href="'mailto:' + ${contact.email}" class="text-red-500 hover:text-red-600" title="Send Email">

              <i class="fa-solid fa-envelope text-lg"></i>

            </a>

            <!-- WhatsApp -->
            <a th:href="'https://wa.me/91' + ${contact.phoneNumber}" target="_blank"
              class="text-green-500 hover:text-green-600" title="Chat on WhatsApp">

              <i class="fa-brands fa-whatsapp text-lg"></i>

            </a>

            <!-- LinkedIn -->
            <a th:if="${contact.linkedInLink != null && !#strings.isEmpty(contact.linkedInLink)}"
              th:href="${contact.linkedInLink}" target="_blank" class="text-blue-600 hover:text-blue-700"
              title="LinkedIn Profile">

              <i class="fa-brands fa-linkedin text-lg"></i>

            </a>

            <!-- Website -->
            <a th:if="${contact.websiteLink != null && !#strings.isEmpty(contact.websiteLink)}"
              th:href="${contact.websiteLink}" target="_blank" class="text-gray-500 hover:text-blue-600"
              title="Visit Website">

              <i class="fa-solid fa-globe text-lg"></i>

            </a>


          </div>

          <!-- Actions -->
          <div class="flex gap-2">

            <button class="w-8 h-8 flex items-center justify-center rounded-lg bg-blue-600 text-white">
              <i class="fa-solid fa-eye text-xs"></i>
            </button>

            <button class="w-8 h-8 flex items-center justify-center rounded-lg bg-yellow-500 text-white">
              <i class="fa-solid fa-pen text-xs"></i>
            </button>

            <button class="w-8 h-8 flex items-center justify-center rounded-lg bg-red-600 text-white">
              <i class="fa-solid fa-trash text-xs"></i>
            </button>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>

</html>
