<!DOCTYPE html>
<html lang="en" th:replace="~{user/user_base :: parent(~{::#content},'Contacts')}">

<div id="content">

  <div class="max-w-7xl mx-auto">

    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">

      <div>
        <h1 class="text-3xl font-bold text-gray-900 dark:text-white">
          My Contacts
        </h1>

        <p class="text-gray-500 dark:text-gray-400">
          Manage and organize your personal and professional contacts.
        </p>
      </div>

      <a th:href="@{/user/contacts/add}"
        class="inline-flex items-center justify-center px-5 py-2.5 text-sm font-medium text-white bg-blue-700 rounded-lg hover:bg-blue-800">

        <i class="fa-solid fa-user-plus mr-2"></i>
        Add Contact

      </a>

    </div>

    <!-- show message -->
    <div data-th-replace="~{message :: messagebox}"></div>

    <!-- Search & Filter -->
    <form method="get" th:action="@{/user/contacts/search}" class="mb-6">

      <div class="flex flex-col md:flex-row gap-3">

        <!-- Filter -->
        <select name="field" class="p-3 text-sm border border-gray-300 rounded-lg
           bg-gray-50 focus:ring-[#1447E6] focus:border-[#1447E6]
           dark:bg-gray-800 dark:border-gray-700 dark:text-white">

          <option value="name" th:selected="${field == 'name'}">Name</option>

          <option value="email" th:selected="${field == 'email'}">Email</option>

          <option value="phoneNumber" th:selected="${field == 'phoneNumber'}">
            Phone Number
          </option>

        </select>

        <!-- Search Input -->
        <div class="relative flex-1">

          <div class="absolute inset-y-0 left-0 flex items-center pl-3">
            <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
          </div>

          <input type="text" name="keyword" placeholder="Search contacts..." th:value="${keyword}" class="block w-full p-3 ps-10 text-sm border border-gray-300 rounded-lg
           bg-gray-50 focus:ring-[#1447E6] focus:border-[#1447E6]
           dark:bg-gray-800 dark:border-gray-700 dark:text-white">
        </div>

        <!-- Search Button -->
        <button type="submit" class="px-5 py-3 bg-blue-700 text-white rounded-lg
                   transition flex items-center justify-center gap-2">

          <i class="fa-solid fa-magnifying-glass"></i>
          Search

        </button>

      </div>

    </form>

    <!-- DESKTOP TABLE -->
    <div class="hidden md:block" th:if="${!pageContact.empty}">

      <div class="overflow-x-auto rounded-xl border border-gray-200 dark:border-gray-700 shadow">

        <table class="w-full text-sm text-left">

          <thead class="bg-gray-100 dark:bg-gray-800">

            <tr>

              <th class="px-6 py-4">Contact</th>
              <th class="px-6 py-4">Email</th>
              <th class="px-6 py-4">Phone</th>
              <th class="px-6 py-4">Social Links</th>
              <th class="px-6 py-4 text-center">Actions</th>

            </tr>

          </thead>

          <tbody>

            <tr th:each="contact : ${pageContact.content}"
              class="bg-white border-b dark:bg-gray-900 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800">

              <!-- Contact -->
              <td class="px-6 py-4">

                <div class="flex items-center gap-3">

                  <img th:src="${contact.picture}" class="w-12 h-12 rounded-full object-cover border">

                  <div>

                    <div class="font-semibold text-gray-900 dark:text-white" th:text="${contact.name}">
                    </div>

                    <div class="flex items-center text-xs text-gray-500 mt-1">

                      <i class="fa-solid fa-location-dot text-gray-400 mr-1.9"></i>

                      <span th:text="${contact.address}"></span>

                    </div>

                  </div>

                </div>

              </td>

              <td class="px-6 py-4">
                <div class="flex items-center gap-2 text-gray-700 dark:text-gray-300">
                  <i class="fa-solid fa-envelope text-[#1447E6]"></i>
                  <span th:text="${contact.email}"></span>
                </div>
              </td>

              <td class="px-6 py-4">
                <div class="flex items-center gap-2 text-gray-700 dark:text-gray-300">
                  <i class="fa-solid fa-phone text-[#1447E6]"></i>
                  <span th:text="${contact.phoneNumber}"></span>
                </div>
              </td>

              <!-- Social Links -->
              <td class="px-6 py-4">
                <div class="flex gap-4">

                  <!-- Email -->
                  <a th:href="'mailto:' + ${contact.email}" style="color:#38BDF8" title="Send Email">

                    <i class="fa-solid fa-envelope text-lg"></i>

                  </a>

                  <!-- WhatsApp -->
                  <a th:href="'https://wa.me/91' + ${contact.phoneNumber}" target="_blank"
                    class="text-green-500 hover:text-green-600" title="Chat on WhatsApp">

                    <i class="fa-brands fa-whatsapp text-lg"></i>

                  </a>

                  <!-- LinkedIn -->
                  <a th:if="${contact.linkedInLink != null && !#strings.isEmpty(contact.linkedInLink)}"
                    th:href="${contact.linkedInLink}" target="_blank" class="text-blue-600 hover:text-blue-700"
                    title="LinkedIn Profile">

                    <i class="fa-brands fa-linkedin text-lg"></i>

                  </a>

                  <!-- Website -->
                  <a th:if="${contact.websiteLink != null && !#strings.isEmpty(contact.websiteLink)}"
                    th:href="${contact.websiteLink}" target="_blank" class="text-gray-500 hover:text-blue-600"
                    title="Visit Website">

                    <i class="fa-solid fa-globe text-lg"></i>

                  </a>


                </div>

              </td>

              <!-- Actions -->
              <td class="px-6 py-4">

                <div class="flex justify-center items-center gap-4">

                  <!-- View -->
                  <button type="button" th:onclick="viewContact([[${contact.id}]])"
                    class="text-[#1447E6] hover:text-blue-400 transition">

                    <i class="fa-solid fa-eye text-lg"></i>

                  </button>

                  <!-- Edit -->
                  <button class="text-[#1447E6] hover:text-blue-400 hover:scale-110 transition-all duration-200">

                    <i class="fa-solid fa-pen text-lg"></i>

                  </button>

                  <!-- Delete -->
                  <button th:onclick="deleteContact([[${contact.id}]])"
                    class="text-red-500 hover:text-red-400 hover:scale-110 transition-all duration-200">

                    <i class="fa-solid fa-trash text-lg"></i>

                  </button>

                </div>

              </td>
            </tr>

          </tbody>

        </table>
        <!-- Pagination -->
        <div class="flex justify-center mt-6 mb-2" th:if="${pageContact.totalPages > 1}">

          <nav aria-label="Pagination">

            <ul class="inline-flex items-center gap-2">

              <!-- Previous -->
              <li th:if="${!pageContact.first}">
                <a th:href="${isSearch}
            ? @{/user/contacts/search(page=${pageContact.number-1}, field=${field}, keyword=${keyword})}
            : @{/user/contacts(page=${pageContact.number-1})}" class="w-9 h-9 flex items-center justify-center rounded-lg
                 bg-gray-800 text-gray-300 hover:bg-[#1447E6]
                 hover:text-white transition">

                  <i class="fa-solid fa-chevron-left"></i>

                </a>
              </li>

              <!-- Page Numbers -->
              <li th:each="i : ${#numbers.sequence(0, pageContact.totalPages - 1)}">

                <a th:href="${isSearch}
            ? @{/user/contacts/search(page=${i}, field=${field}, keyword=${keyword})}
            : @{/user/contacts(page=${i})}" th:text="${i + 1}" th:classappend="${i == pageContact.number}
            ? ' bg-[#1447E6] text-white'
            : ' bg-gray-800 text-gray-300 hover:bg-gray-700'"
                  class="w-9 h-9 flex items-center justify-center rounded-lg transition">

                </a>

              </li>

              <!-- Next -->
              <li th:if="${!pageContact.last}">
                <a th:href="${isSearch}
            ? @{/user/contacts/search(page=${pageContact.number+1}, field=${field}, keyword=${keyword})}
            : @{/user/contacts(page=${pageContact.number+1})}" class="w-9 h-9 flex items-center justify-center rounded-lg
                 bg-gray-800 text-gray-300 hover:bg-[#1447E6]
                 hover:text-white transition">

                  <i class="fa-solid fa-chevron-right"></i>

                </a>
              </li>

            </ul>

          </nav>

        </div>

      </div>

    </div>

    <!-- MOBILE VIEW -->
    <div class="grid gap-4 md:hidden" th:if="${!pageContact.empty}">

      <div th:each="contact : ${pageContact.content}"
        class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-4 shadow">

        <div class="flex items-center gap-3">

          <img th:src="${contact.picture}" class="w-14 h-14 rounded-full object-cover border" alt="contact">

          <div class="flex-1">

            <h3 class="font-semibold text-gray-900 dark:text-white" th:text="${contact.name}">
              John Doe
            </h3>

            <div class="flex items-center gap-1 text-sm text-gray-500">

              <i class="fa-solid fa-location-dot text-xs text-gray-400"></i>

              <span th:text="${contact.address}"></span>

            </div>

          </div>

        </div>

        <div class="mt-4 space-y-2 text-sm">

          <p class="text-gray-700 dark:text-gray-300">
            <i class="fa-solid fa-envelope w-5"></i>
            <span th:text="${contact.email}"></span>
          </p>

          <p class="text-gray-700 dark:text-gray-300">
            <i class="fa-solid fa-phone w-5"></i>
            <span th:text="${contact.phoneNumber}"></span>
          </p>



        </div>

        <!-- Social Links -->
        <div class="mt-4 flex items-center justify-between">

          <!-- Social Links -->
          <div class="flex gap-4">

            <!-- Email -->
            <a th:href="'mailto:' + ${contact.email}" style="color:#38BDF8" title="Send Email">

              <i class="fa-solid fa-envelope text-lg"></i>

            </a>

            <!-- WhatsApp -->
            <a th:href="'https://wa.me/91' + ${contact.phoneNumber}" target="_blank"
              class="text-green-500 hover:text-green-600" title="Chat on WhatsApp">

              <i class="fa-brands fa-whatsapp text-lg"></i>

            </a>

            <!-- LinkedIn -->
            <a th:if="${contact.linkedInLink != null && !#strings.isEmpty(contact.linkedInLink)}"
              th:href="${contact.linkedInLink}" target="_blank" class="text-blue-600 hover:text-blue-700"
              title="LinkedIn Profile">

              <i class="fa-brands fa-linkedin text-lg"></i>

            </a>

            <!-- Website -->
            <a th:if="${contact.websiteLink != null && !#strings.isEmpty(contact.websiteLink)}"
              th:href="${contact.websiteLink}" target="_blank" class="text-gray-500 hover:text-blue-600"
              title="Visit Website">

              <i class="fa-solid fa-globe text-lg"></i>

            </a>


          </div>

          <!-- Actions -->
          <div class="flex items-center gap-4">

            <!-- View -->
            <button type="button" th:onclick="viewContact([[${contact.id}]])"
              class="text-[#1447E6] hover:text-blue-400 transition">

              <i class="fa-solid fa-eye text-lg"></i>

            </button>

            <!-- Edit -->
            <button class="text-[#1447E6] hover:text-blue-400 hover:scale-110 transition-all duration-200">

              <i class="fa-solid fa-pen"></i>

            </button>

            <!-- Delete -->
            <button th:onclick="deleteContact([[${contact.id}]])"
              class="text-red-500 hover:text-red-400 hover:scale-110 transition-all duration-200">

              <i class="fa-solid fa-trash"></i>

            </button>

          </div>

        </div>

      </div>


      <!-- pagination component -->
      <div class="flex justify-center mt-6 mb-2" th:if="${pageContact.totalPages > 1}">

        <nav>

          <ul class="inline-flex items-center gap-1">

            <!-- Previous -->
            <li th:if="${!pageContact.first}">
              <a th:href="${isSearch}
            ? @{/user/contacts/search(page=${pageContact.number-1}, field=${field}, keyword=${keyword})}
            : @{/user/contacts(page=${pageContact.number-1})}" class="w-8 h-8 md:w-9 md:h-9 flex items-center justify-center
                 rounded-lg bg-gray-800 text-gray-300
                 hover:bg-[#1447E6] hover:text-white transition">

                <i class="fa-solid fa-chevron-left text-xs"></i>

              </a>
            </li>

            <!-- Page Numbers -->
            <li th:each="i : ${#numbers.sequence(0, pageContact.totalPages - 1)}">

              <a th:href="${isSearch}
            ? @{/user/contacts/search(page=${i}, field=${field}, keyword=${keyword})}
            : @{/user/contacts(page=${i})}" th:text="${i + 1}" th:classappend="${i == pageContact.number}
            ? ' bg-[#1447E6] text-white'
            : ' bg-gray-800 text-gray-300 hover:bg-gray-700'" class="w-8 h-8 md:w-9 md:h-9 flex items-center justify-center
                 rounded-lg text-sm transition">

              </a>

            </li>

            <!-- Next -->
            <li th:if="${!pageContact.last}">
              <a th:href="${isSearch}
            ? @{/user/contacts/search(page=${pageContact.number+1}, field=${field}, keyword=${keyword})}
            : @{/user/contacts(page=${pageContact.number+1})}" class="w-8 h-8 md:w-9 md:h-9 flex items-center justify-center
                 rounded-lg bg-gray-800 text-gray-300
                 hover:bg-[#1447E6] hover:text-white transition">

                <i class="fa-solid fa-chevron-right text-xs"></i>

              </a>
            </li>

          </ul>

        </nav>

      </div>

    </div>

    <!-- EMPTY STATE -->
    <div th:if="${pageContact.empty}" class="flex flex-col items-center justify-center py-16">

      <div class="w-24 h-24 rounded-full bg-gray-800 flex items-center justify-center">
        <i class="fa-solid fa-user-slash text-4xl text-gray-500"></i>
      </div>

      <h2 class="mt-6 text-2xl font-bold text-white">
        Contact Not Found
      </h2>

      <p class="mt-2 text-gray-400">
        No contacts found for
        <span th:text="${keyword}" class="font-semibold text-white"></span>
      </p>

      <a th:href="@{/user/contacts}" class="mt-6 px-5 py-2.5 bg-[#1447E6] rounded-lg text-white">
        View All Contacts
      </a>

    </div>

    


  </div>

</div>

</html>
