<!DOCTYPE html>
<html lang="en" th:replace="~{user/user_base :: parent(~{::#content},'Edit Profile')}">

<body>

  <div id="content" class="p-6">

    <div class="max-w-3xl mx-auto">

      <h1 class="text-3xl font-bold text-white">
        Edit Profile
      </h1>

      <p class="text-gray-400 mt-2 mb-8">
        Update your personal information.
      </p>

      <form th:action="@{/user/profile/update}" method="post" th:object="${user}" enctype="multipart/form-data"
        class="bg-gray-800 rounded-2xl p-8 space-y-6 shadow">

        <div class="flex flex-col items-center mb-8">

    <!-- Profile Image -->
    <img id="upload_image_preview"
         th:src="${user.profilePic}"
         class="w-32 h-32 rounded-full border-4 border-blue-600 object-cover shadow-lg">

    <label class="mt-5 mb-3 text-sm font-medium text-gray-300">
        Change Profile Picture
    </label>

    <input
    type="file"
    name="profileImage"
    accept="image/*"
    class="max-w-[220px] sm:max-w-xs text-xs sm:text-sm text-gray-300
           file:bg-blue-600
           file:hover:bg-blue-700
           file:text-white
           file:px-3
           sm:file:px-4
           file:py-2
           rounded-lg
           file:border-0
           border border-white-600
           file:cursor-pointer">

</div>

        <!-- Name -->

        <div>

          <label class="block text-gray-300 mb-2">
            Full Name
          </label>

          <input type="text" th:field="*{name}"
            class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 outline-none">

        </div>

        <!-- Email -->

        <div>

          <label class="block text-gray-300 mb-2">
            Email Address
          </label>

          <input type="email" th:field="*{email}" readonly
            class="w-full bg-gray-700 border border-gray-700 rounded-lg px-4 py-3 text-gray-400 cursor-not-allowed">

        </div>

        <!-- Phone -->

        <div>

          <label class="block text-gray-300 mb-2">
            Phone Number
          </label>

          <input type="text" th:field="*{phoneNumber}"
            class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 outline-none">

        </div>

        <!-- About -->

        <div>

          <label class="block text-gray-300 mb-2">
            About
          </label>

          <textarea rows="5" th:field="*{about}"
            class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 outline-none"></textarea>

        </div>

        <!-- Buttons -->

        <div class="flex gap-4">

          <button type="submit" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 rounded-lg text-white font-medium">

            <i class="fa-solid fa-floppy-disk mr-2"></i>

            Save Changes

          </button>

          <a th:href="@{/user/profile}" class="px-6 py-3 bg-gray-700 hover:bg-gray-600 rounded-lg text-white">

            Cancel

          </a>

        </div>

      </form>

    </div>

  </div>

</body>

</html>
